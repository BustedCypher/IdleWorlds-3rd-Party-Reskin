name: CI

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild production bundle
        run: python3 build-tools/build_recovered.py --allow-missing-assets

      - name: Check generated JavaScript syntax
        run: node --check dist/content.bundle.js

      - name: Run regression suites
        run: npm test
