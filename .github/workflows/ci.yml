name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild, syntax-check and run regression suites
        run: npm test

      - name: Sync generated production bundle on same-repository working branches
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          git add -- dist/content.bundle.js
          if git diff --cached --quiet; then
            echo "dist/content.bundle.js is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild production bundle"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
