<div class="panel p-3.5" id="g-world-chat">
  <div class="flex items-center justify-between">
    <div>
      <h2>World Chat</h2>
      <p>Showing the latest 100 messages.</p>
    </div>
    <div>
      <button aria-label="Favourite chat">☆</button>
      <button aria-label="Chat settings">⚙</button>
    </div>
  </div>
  <div>
    <div>
      <span>12:00:01</span>
      <button class="chat-name-3 hover:underline">Kaelen</button>
      <span>hello</span>
    </div>
    <div>
      <span>12:00:02</span>
      <button class="chat-name-1 hover:underline">Mira</button>
      <span>hi</span>
    </div>
  </div>
  <form class="flex gap-2">
    <input placeholder="Message World Chat">
    <button>Send</button>
  </form>
</div>
