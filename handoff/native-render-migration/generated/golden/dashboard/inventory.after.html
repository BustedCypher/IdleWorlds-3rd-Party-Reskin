<div class="panel p-3.5" id="g-inventory" data-iw-inventory-root="1" data-iw-ui="section-frame">
  <div class="flex items-center justify-between" data-iw-collapse-head="1">
    <div data-iw-collapse-spine="1">
      <h2 data-iw-inventory-title="1" data-iw-ui="section-title" data-iw-collapse-title="1" data-iw-collapse-spine="1">Inventory</h2>
    </div>
    <div class="flex items-center gap-2">
      <div class="relative">
        <button aria-label="Filter inventory" title="Filter inventory" data-iw-inventory-control="icon">
          <svg width="16" height="16"></svg>
        </button>
      </div>
      <button aria-label="Search inventory" title="Search inventory" data-iw-inventory-control="icon">
        <svg width="16" height="16"></svg>
      </button>
      <button aria-label="Equipment Window" title="Equipment Window" data-iw-inventory-control="icon">
        <svg width="16" height="16"></svg>
      </button>
      <svg class="lucide lucide-package h-4 w-4 text-ember" width="16" height="16" data-iw-inventory-control="glyph"></svg>
    </div>
    <button type="button" data-iw-collapse="1" aria-expanded="true" aria-label="Collapse Inventory" title="Collapse Inventory"></button>
  </div>
  <div class="fs-inv-rule" aria-hidden="true"></div>
  <div class="flex gap-2" data-iw-inventory-filters="1">
    <button class="bg-orange-500" data-iw-inventory-control="filter" data-iw-inventory-filter-state="active" data-iw-compact-button="text">
      All
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
    <button data-iw-inventory-control="filter" data-iw-compact-button="text">
      Gear
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
    <button data-iw-inventory-control="filter" data-iw-compact-button="text">
      Materials
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
    <button data-iw-inventory-control="filter" data-iw-compact-button="text">
      Consumables
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
    <button data-iw-inventory-control="filter" data-iw-compact-button="text">
      Drops
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
  </div>
  <div class="space-y-1.5" data-iw-inventory-list="1">
    <div class="compact-row py-2" data-fs-inv="moonsteel_ore||14||1|1">
      <div style="display: none;" data-fs-suppressed="1">
        <span>Moonsteel Ore</span>
      </div>
      <div style="display: none;" data-fs-suppressed="1">
        <span>Tier 3 · Resource</span>
      </div>
      <div style="display: none;" data-fs-suppressed="1">
        <span>x14</span>
      </div>
      <button data-fs-preserved-action="control" data-fs-action-kind="secondary" data-iw-compact-button="text">
        List
        <span data-iw-compact-layer="idle" aria-hidden="true"></span>
        <span data-iw-compact-layer="hover" aria-hidden="true"></span>
        <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
      </button>
      <div class="fs-inv-row fs-cat-resource">
        <div class="fs-inv-icon" data-iw-item="moonsteel_ore" data-iw-tooltip-trigger="1" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-label="Moonsteel Ore, item details" style="background-image: url(&quot;/fantasy-skin/assets/item_icons_atlas.png&quot;); background-size: 1000% 4800%; background-position: 33.3333% 2.12766%; background-repeat: no-repeat;" data-iw-atlas="item"></div>
        <div class="fs-inv-body">
          <div class="fs-inv-name">
            <span class="iw-item-ref" role="button" tabindex="0" data-iw-item="moonsteel_ore" aria-haspopup="dialog" aria-controls="iw-tip" aria-expanded="false" aria-label="Moonsteel Ore, item details">
              <span class="iw-item-name">Moonsteel Ore</span>
              <span class="iw-item-info" aria-hidden="true">i</span>
            </span>
          </div>
          <div class="fs-inv-stats">
            <span class="fs-stat fs-stat--tier">Tier 3</span>
          </div>
        </div>
        <span class="fs-inv-qty">×14</span>
      </div>
    </div>
    <div class="compact-row py-2" data-fs-inv="iron_sword||1|loadout:in loadout i:1|1|1">
      <div style="display: none;" data-fs-suppressed="1">
        <span>Iron Sword</span>
      </div>
      <div style="display: none;" data-fs-suppressed="1">
        <span>Tier 4 · Weapon</span>
        <span>In loadout I</span>
      </div>
      <div style="display: none;" data-fs-suppressed="1">
        <span>x1</span>
      </div>
      <button data-fs-preserved-action="control" data-fs-action-kind="equip" data-iw-compact-button="text">
        Equip
        <span data-iw-compact-layer="idle" aria-hidden="true"></span>
        <span data-iw-compact-layer="hover" aria-hidden="true"></span>
        <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
      </button>
      <button data-fs-preserved-action="control" data-fs-action-kind="secondary" data-iw-compact-button="text">
        List
        <span data-iw-compact-layer="idle" aria-hidden="true"></span>
        <span data-iw-compact-layer="hover" aria-hidden="true"></span>
        <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
      </button>
      <div class="fs-inv-row fs-cat-gear has-details">
        <div class="fs-inv-icon" data-iw-item="iron_sword" data-iw-tooltip-trigger="1" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-label="Iron Sword, item details" style="background-image: url(&quot;/fantasy-skin/assets/gear_icons_atlas.png&quot;); background-size: 1000% 15300%; background-position: 0% 1.31579%; background-repeat: no-repeat;" data-iw-atlas="gear"></div>
        <div class="fs-inv-body">
          <div class="fs-inv-name">
            <span class="iw-item-ref" role="button" tabindex="0" data-iw-item="iron_sword" aria-haspopup="dialog" aria-controls="iw-tip" aria-expanded="false" aria-label="Iron Sword, item details">
              <span class="iw-item-name">Iron Sword</span>
              <span class="iw-item-info" aria-hidden="true">i</span>
            </span>
          </div>
          <div class="fs-inv-stats">
            <span class="fs-stat fs-stat--tier">Tier 4 · Weapon</span>
            <span class="fs-stat fs-stat--pos">ATK +12</span>
          </div>
          <div class="fs-inv-details">
            <span class="fs-inv-detail fs-inv-detail--loadout">In loadout I</span>
          </div>
        </div>
        <span class="fs-inv-qty">×1</span>
      </div>
    </div>
  </div>
  <div class="flex items-center justify-between">
    <button data-iw-inventory-control="page" data-iw-compact-button="text">
      Prev
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
    <span data-iw-inventory-control="page-count">1 / 3</span>
    <button data-iw-inventory-control="page" data-iw-compact-button="text">
      Next
      <span data-iw-compact-layer="idle" aria-hidden="true"></span>
      <span data-iw-compact-layer="hover" aria-hidden="true"></span>
      <span data-iw-compact-layer="clicked" aria-hidden="true"></span>
    </button>
  </div>
</div>
