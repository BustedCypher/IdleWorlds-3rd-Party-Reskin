<div class="panel p-3.5" id="g-addons" data-iw-ui="section-frame" data-iw-village="addons">
  <h2 data-iw-ui="section-title" data-iw-collapse-head="1" data-iw-collapse-title="1">
    🏗️ Village Add-ons
    <button type="button" data-iw-collapse="1" aria-expanded="true" aria-label="Collapse Village Add-ons" title="Collapse Village Add-ons"></button>
  </h2>
  <p data-iw-village-role="intro">3 slots available (1 per housing tier). Assemble buildings through Construction.</p>
  <div class="space-y-2">
    <div class="compact-panel" data-iw-village="slot" data-iw-village-state="installed">
      <div class="flex items-start justify-between gap-3" data-iw-village-role="head">
        <div data-iw-village-role="copy">
          <p data-iw-village-role="index">Slot 1</p>
          <p data-iw-village-role="name">Voidiron Archive</p>
          <p data-iw-village-role="effects">+4 ATK • +7 XP/task</p>
        </div>
        <div data-iw-village-role="actions">
          <button data-iw-village-role="action" data-iw-village-action="destroy">Destroy</button>
          <button data-iw-village-role="action" data-iw-village-action="uninstall">Uninstall (100k)</button>
        </div>
      </div>
      <div class="iw-village-art" data-iw-village-owned="1" aria-hidden="true" data-iw-village-art="building" style="--iw-village-sprite: url(&quot;/fantasy-skin/assets/village/building_11.webp&quot;);"></div>
    </div>
    <div class="compact-panel" data-iw-village="slot" data-iw-village-state="vacant">
      <div class="flex items-start justify-between gap-3" data-iw-village-role="head">
        <div data-iw-village-role="copy">
          <p data-iw-village-role="index">Slot 2</p>
          <p data-iw-village-role="vacant">Empty slot</p>
        </div>
        <button data-iw-village-role="action" data-iw-village-action="install">Install</button>
      </div>
      <div class="iw-village-art" data-iw-village-owned="1" aria-hidden="true" data-iw-village-art="generic"></div>
    </div>
  </div>
  <p data-iw-village-role="note">Assemble a building to install it here.</p>
</div>
