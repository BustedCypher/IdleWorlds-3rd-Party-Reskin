<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss headshot overlays</title><link rel="stylesheet" href="../boss-health-atlas.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#101318;color:#eee8dc;font:14px system-ui}main{max-width:900px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#aab4be}section{margin:24px 0}h2{font-size:17px;margin:0 0 6px}.frame{position:relative;width:100%;aspect-ratio:1216/406}.raw{background:conic-gradient(#303840 25%,#232b33 0 50%,#303840 0 75%,#232b33 0) 0 0/16px 16px}.raid-boss-art{position:absolute;inset:0;pointer-events:none}.track{position:absolute;left:23.0263%;top:41.3793%;width:66.1184%;height:16.7488%;border-radius:4px;background:#110d13;overflow:hidden}.fill{height:100%;width:var(--hp);background:linear-gradient(#e3725c,#ad342b 35%,#751b20);box-shadow:inset 0 1px #ffbd92}.hp{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none}.examples{display:grid;grid-template-columns:1fr 1fr;gap:16px}.caption{font-size:11px;color:#8f9da9;margin-bottom:4px}input{width:100%;accent-color:#c85b50}@media(max-width:700px){body{padding:12px}.examples{grid-template-columns:1fr}}
</style><main><h1>Boss headshot overlays</h1><p>Transparent HP windows · separate portraits · 32px atlas gutters</p><label>Sample live health <input id="health" type="range" min="0" max="100" value="49"></label><div id="frames"></div></main>
<script>
const names=['Ashmaw','Thessaly','Morwenna','Grimjaw','Skarth'];
document.querySelector('#frames').innerHTML=names.map(name=>`<section><h2>${name}</h2><div class="examples"><div><div class="caption">Transparent overlay (checkerboard underneath)</div><div class="frame raw"><i class="raid-boss-art" data-encounter="${name.toLowerCase()}"></i></div></div><div><div class="caption">Live fill underneath the frame</div><div class="frame"><div class="track"><div class="fill" style="--hp:49%"></div><b class="hp">49%</b></div><i class="raid-boss-art" data-encounter="${name.toLowerCase()}"></i></div></div></div></section>`).join('');
document.querySelector('#health').addEventListener('input',e=>{for(const f of document.querySelectorAll('.fill'))f.style.setProperty('--hp',e.target.value+'%');for(const t of document.querySelectorAll('.hp'))t.textContent=e.target.value+'%';});
</script></html>
