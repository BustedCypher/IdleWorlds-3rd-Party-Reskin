<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fantasy button artwork</title>
<style>body{margin:40px;background:#171511;color:#e9ddc7;font:16px Georgia}h1{font-size:28px}main{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}figure{margin:0;padding:20px;background:#25221d;border:1px solid #675032;border-radius:8px;text-align:center}img{width:100%;height:180px;object-fit:contain}.action img{height:100px}.left{transform:scaleX(-1)}figcaption{margin-top:16px;color:#ccae78}h2{margin-top:36px;font-size:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}body{margin:20px}}</style>
<main><h1>Fantasy button artwork</h1><p>Aged bronze, dark stone, and amber highlights, based on the original Skills UI atlas.</p><h2>Action button</h2><div class="grid action"><figure><img src="action-hover.png" alt="Action hover artwork"><figcaption>Hover</figcaption></figure><figure><img src="action-pressed.png" alt="Action pressed artwork"><figcaption>Pressed</figcaption></figure></div>
<h2>Next chevron</h2><div class="grid"><figure><img src="chevron-idle.png" alt="Next idle"><figcaption>Idle</figcaption></figure><figure><img src="chevron-hover.png" alt="Next hover"><figcaption>Hover</figcaption></figure><figure><img src="chevron-pressed.png" alt="Next pressed"><figcaption>Pressed</figcaption></figure></div>
<h2>Previous chevron</h2><div class="grid"><figure><img class="left" src="chevron-idle.png" alt="Previous idle"><figcaption>Idle</figcaption></figure><figure><img class="left" src="chevron-hover.png" alt="Previous hover"><figcaption>Hover</figcaption></figure><figure><img class="left" src="chevron-pressed.png" alt="Previous pressed"><figcaption>Pressed</figcaption></figure></div></main></html>
